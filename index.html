<title>진표의 영어 비행단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#14123a;--sun:#ffc93c;--sky:#8fd3ff;--leaf:#3fb96b;--berry:#ff5d73;--cream:#fffaf0;}
html,body{height:100%;margin:0;background:#0f1b3d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
#app{position:fixed;inset:0;width:100vw;height:100dvh;font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:'Jua','Apple SD Gothic Neo',sans-serif;cursor:pointer;border:0;color:var(--ink);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto}
.big{font-size:min(30px,5.4vh);padding:min(14px,2.4vh) 40px;border-radius:999px;background:var(--sun);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.sub{font-size:min(17px,3vh);opacity:.85;margin:0;text-align:center;word-break:keep-all}
/* 타이틀 */
#title{background:radial-gradient(ellipse at 50% 10%,#5b7bd5 0%,#1a2a5e 55%,#0d1430 100%)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:min(14px,2.4vh);text-align:center}
.tplane{position:relative;width:min(190px,30vh);height:min(150px,24vh);display:grid;place-items:center;animation:fly 2.6s ease-in-out infinite}
.tplane img{position:relative;z-index:2;width:min(112px,18vh);height:min(112px,18vh);border-radius:50%;object-fit:cover;border:5px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink)}
.tplane .wingl,.tplane .wingr{position:absolute;top:54%;width:min(64px,10vh);height:min(20px,3.4vh);background:#2f9cf0;border:4px solid var(--ink);border-radius:8px}
.tplane .wingl{left:0;transform:rotate(-16deg)}
.tplane .wingr{right:0;transform:rotate(16deg)}
.tplane .jet{position:absolute;bottom:-4%;font-size:min(40px,7vh);z-index:3}
@keyframes fly{50%{transform:translateY(-12px) rotate(-4deg)}}
.logo{font-family:'Jua',sans-serif;font-size:min(58px,10vh,11vw);line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),4px 8px 0 rgba(0,0,0,.35);margin:0}
#title .sub{color:#dfe8ff}
/* 지도 */
#map{background:linear-gradient(#1a2a5e,#3f63b8);flex-direction:column;justify-content:flex-start;gap:min(14px,2.2vh)}
#map h2{font-family:'Jua';font-size:min(36px,6.6vh);margin:0;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
#map .sub{color:#e6ecff}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:1060px}
@media (max-width:860px){.stages{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{position:relative;border-radius:22px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:min(14px,2vh) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;transition:transform .08s}
.scard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.scard .sym{font-size:min(28px,5.4vh);width:min(74px,13vh);height:min(74px,13vh);display:grid;place-items:center;border-radius:50%;color:#fff;border:3px solid var(--ink)}
.scard .sn{font-family:'Jua';font-size:min(21px,3.8vh)}
.scard .sd{font-size:min(13px,2.4vh);opacity:.75}
.scard .rec{font-family:'Jua';font-size:min(17px,3vh);min-height:1.3em}
.crown{position:absolute;top:-16px;right:-6px;font-size:28px;transform:rotate(14deg)}
.maprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{font-family:'Jua';font-size:min(18px,3.2vh);padding:8px 16px;border-radius:999px;border:3px solid var(--ink);background:#fff}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.93);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:'Jua';font-size:min(22px,4.4vh);box-shadow:0 3px 0 var(--ink)}
.chip.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}
.hearts{display:flex;gap:1px;font-size:min(24px,4.4vh);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.hearts i{font-style:normal;transition:transform .2s,opacity .2s}
.hearts i.off{opacity:.25;transform:scale(.8)}
.hbtn{width:min(44px,8vh);height:min(44px,8vh);border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:min(20px,4vh);display:grid;place-items:center}
.hr{display:flex;gap:8px}
.hl{display:flex;flex-direction:row;gap:8px;align-items:center;flex-wrap:wrap}
/* 문제 띠 */
#qbar{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top));display:flex;justify-content:center;padding:0 10px;pointer-events:none;z-index:2}
.qb{pointer-events:auto;width:min(620px,100%);background:rgba(255,250,240,.96);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:min(8px,1.4vh) 14px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.qb .ask{font-family:'Jua';font-size:min(26px,4.2vh,5.4vw);text-align:center;word-break:keep-all;line-height:1.25}
.qb .tgt{font-family:'Jua';display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;line-height:1.1}
.qb .tgt.letter{font-size:min(74px,11vh,16vw)}
.qb .tgt.emoji{font-size:min(64px,9.5vh,15vw)}
.qb .tgt.pic{flex-direction:row;gap:10px}
.qb .tgt .em{font-size:min(60px,9vh,14vw)}
.qb .tgt .wd{font-size:min(48px,7.4vh,11vw);display:flex;align-items:center}
.qb .tgt .ko{font-size:min(38px,6vh,9vw)}
.qb .tgt .sen{font-size:min(34px,5.2vh,6.6vw);display:flex;align-items:center;gap:.1em;flex-wrap:wrap;justify-content:center;line-height:1.2}
.qb .tgt.sent{flex-direction:column;gap:2px}
.qb .tgt .ko2{font-family:'Gowun Dodum';font-size:min(19px,3.2vh,4.2vw);opacity:.75}
.qb .tgt .bl{display:inline-grid;place-items:center;min-width:.85em;height:1.05em;border-radius:10px;background:var(--sun);border:3px solid var(--ink);padding:0 .1em;margin:0 .1em}
.qb .row{display:flex;align-items:center;gap:8px}
.speak{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-family:'Jua';font-size:min(18px,3.2vh);box-shadow:0 3px 0 var(--ink)}
.qb .fb{font-family:'Jua';font-size:min(22px,3.6vh);color:var(--berry);margin:0;text-align:center;word-break:keep-all}
/* 조작 */
#pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none;z-index:3}
.fire{pointer-events:auto;width:min(118px,21vh);height:min(118px,21vh);border-radius:50%;background:rgba(255,93,115,.9);border:5px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:#fff;font-family:'Jua';font-size:min(26px,4.6vh);display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.fire:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.movehint{pointer-events:none;color:#fff;font-family:'Jua';font-size:min(16px,2.8vh);opacity:.7;background:rgba(0,0,0,.3);border-radius:999px;padding:6px 14px}
.keyhelp{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:3}
/* 결과 */
#result,#over{background:rgba(14,18,58,.6)}
.rcard{background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:min(24px,3.4vh) 28px;display:flex;flex-direction:column;align-items:center;gap:min(12px,2vh);text-align:center;max-width:520px;width:100%;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.rcard h2{font-family:'Jua';font-size:min(42px,7.6vh);margin:0}
.medal{font-size:min(76px,13vh);line-height:1}
.rstats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rstat{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 16px;font-family:'Jua';font-size:min(21px,3.8vh)}
.rbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ver{position:absolute;right:10px;bottom:8px;font-size:12px;color:#fff;opacity:.5}
@media (max-width:560px){
  .chip{font-size:18px;padding:2px 9px;gap:3px}
  .hearts{font-size:16px}
  .hbtn{width:36px;height:36px;font-size:16px;box-shadow:0 2px 0 var(--ink)}
  #hud{gap:4px;padding-left:8px;padding-right:8px}
  .hr{gap:5px}
  #qbar{top:calc(44px + env(safe-area-inset-top))}
  .qb{padding:6px 10px}
  .qb .ask{font-size:min(20px,3.4vh,5vw)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="hl">
    <div class="chip"><span style="color:#f5a300">★</span><span id="hStars">0</span></div>
    <div class="hearts" id="hHearts"></div>
  </div>
  <div class="hr">
    <div class="chip" id="hWave">1/8</div>
    <button class="hbtn" id="hSound" aria-label="소리">🔊</button>
    <button class="hbtn" id="hHome" aria-label="지도로">🗺️</button>
  </div>
</div>

<div id="qbar" hidden>

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const pick = a => a[ri(0, a.length - 1)];
function pickMany(arr, n, bad) {
  const out = [], seen = new Set(); let guard = 0;
  while (out.length < n && guard++ < 500) { const x = pick(arr); const k = x.w || x.en || x; if (seen.has(k) || (bad && bad(x))) continue; seen.add(k); out.push(x); }
  return out;
}

const hasJong = t => { const c = t.charCodeAt(t.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 > 0; };
const jo = (t, pair) => t + (hasJong(t) ? pair[0] : pair[1]);

function wordPool(g) {
  let p = WORDS.filter(x => x.g === g);
  if (p.length < 12) p = WORDS.filter(x => x.g <= g);
  return p;
}
function sentPool(g) { return SENTS.filter(x => x.g === g); }
function talkPool(g) { const p = TALKS.filter(x => x.g === g); return p.length ? p : TALKS.filter(x => x.g <= g); }
function distract(pool, right, n) {
  const bad = o => o.w === right.w || o.k === right.k || (right.e && o.e === right.e);
  const out = pickMany(pool.filter(o => !bad(o)), n);
  return out;
}

const SENT_RATE = [0.2, 0.35, 0.5, 0.6, 0.7, 0.75];
const TALK_RATE = [0.1, 0.1, 0.2, 0.2, 0.25, 0.25];
function makeQ(gi, step) {
  const r = Math.random();

let melStep = 0, melNext = 0;

}

  if (r.width === cssW && r.height === cssH) return;
  cssW = r.width; cssH = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cssH / VH; vw = cssW / scale; vh = VH;
  fieldW = Math.min(vw - 20, 560); fx0 = (vw - fieldW) / 2;
  measureBar();
  if (P) { P.x = Math.max(fx0 + 26, Math.min(fx0 + fieldW - 26, P.x)); P.y = Math.max(yTop + 40, Math.min(VH - 60, P.y)); }
  if (foes) foes.forEach((f, i) => {
    f.bx = fx0 + fieldW * (i + 0.5) / foes.length; f.amp = Math.min(fieldW / foes.length / 2 - 10, 44);
    const top = yTop + (bossHP > 0 ? 126 : 50);
    const band = Math.max(60, yBot - top - 40);
    f.by = top + band * (i % 2 ? 0.55 : 0.15);
    f.lines = null;
  });
  fitAll();
}

/* ---------- 루프 ---------- */
resetPlayer(); bullets = []; foes = []; bombs = []; parts = [];
let last = performance.now();
function loop(now) {
  const dt = Math.min(2.5, (now - last) / 16.67); last = now;
  resize();
  if (state !== 'result' && state !== 'over') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
