<style>
:root{--ink:#14123a;--sun:#ffc93c;--berry:#ff5d73;--cream:#fffaf0;--leaf:#3fb96b}
html,body{height:100%;margin:0;background:#0d1430;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
#app{position:fixed;inset:0;width:100vw;height:100dvh;font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:'Jua','Apple SD Gothic Neo',sans-serif;cursor:pointer;border:0;color:var(--ink);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow:auto;z-index:5}
.big{font-family:'Jua';font-size:min(28px,5vh);padding:min(13px,2.2vh) 36px;border-radius:999px;background:var(--sun);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.sub{font-size:min(16px,2.8vh);opacity:.85;margin:0;text-align:center;word-break:keep-all;line-height:1.5}
/* 타이틀 */
#title{background:radial-gradient(ellipse at 50% 0%,#5b7bd5 0%,#1a2a5e 55%,#0d1430 100%)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:min(12px,2vh);text-align:center}
.tplane{position:relative;width:min(210px,32vh);height:min(120px,20vh);display:grid;place-items:center;animation:fly 2.8s ease-in-out infinite}
.tplane img{position:relative;z-index:2;width:min(96px,16vh);height:min(96px,16vh);border-radius:50%;object-fit:cover;border:5px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink)}
.tplane .w1,.tplane .w2{position:absolute;height:min(18px,3vh);background:#2f9cf0;border:4px solid var(--ink);border-radius:9px}
.tplane .w1{left:2%;top:52%;width:min(70px,11vh);transform:rotate(-12deg)}
.tplane .w2{right:2%;top:52%;width:min(70px,11vh);transform:rotate(12deg)}
.tplane .jet{position:absolute;left:-2%;font-size:min(34px,5.6vh);z-index:1;animation:puff 1.2s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes puff{50%{transform:translateX(-8px) scale(.85);opacity:.6}}
.logo{font-family:'Jua',sans-serif;font-size:min(54px,9.4vh,10vw);line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),4px 8px 0 rgba(0,0,0,.35);margin:0}
#title .sub{color:#dfe8ff}
/* 지도 */
#map{background:linear-gradient(#182a5e,#3f63b8);flex-direction:column;justify-content:center;gap:min(12px,2vh)}
#map h2{font-family:'Jua';font-size:min(32px,6vh);margin:0;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
#map .sub{color:#e6ecff}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;width:100%;max-width:1040px}
@media (max-width:820px){.stages{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scard{position:relative;border-radius:20px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:min(11px,1.7vh) 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;transition:transform .08s}
.scard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.scard .sym{font-family:'Jua';font-size:min(24px,4.6vh);width:min(58px,10vh);height:min(58px,10vh);display:grid;place-items:center;border-radius:50%;color:#fff;border:3px solid var(--ink)}
.scard .sn{font-family:'Jua';font-size:min(18px,3.2vh)}
.scard .sd{font-size:min(12px,2.2vh);opacity:.72;word-break:keep-all;line-height:1.3}
.scard .rec{font-family:'Jua';font-size:min(15px,2.6vh);min-height:1.3em;color:#e08a16}
.crown{position:absolute;top:-14px;right:-6px;font-size:24px;transform:rotate(14deg)}
.maprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{font-family:'Jua';font-size:min(17px,3vh);padding:7px 15px;border-radius:999px;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink)}
.pill.on{background:var(--sun)}
/* 조작 */
#pad{position:absolute;inset:0;pointer-events:none;z-index:4}
.fire{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;width:min(104px,19vh);height:min(104px,19vh);border-radius:50%;background:rgba(255,93,115,.92);border:5px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:#fff;font-family:'Jua';font-size:min(22px,4vh);display:grid;place-items:center;line-height:1.1}
.fire:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.keyhelp{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:4}
#rotate{position:absolute;inset:0;background:rgba(13,20,48,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;font-family:'Jua';font-size:min(26px,4.6vh);text-align:center}
#rotate .ph{font-size:70px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(90deg)}}
/* 결과 */
#result,#over{background:rgba(13,18,58,.62)}
.rcard{background:var(--cream);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:min(20px,3vh) 24px;display:flex;flex-direction:column;align-items:center;gap:min(10px,1.6vh);text-align:center;max-width:580px;width:100%;max-height:100%;overflow:auto;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.rcard h2{font-family:'Jua';font-size:min(38px,6.6vh);margin:0}
.medal{font-size:min(64px,11vh);line-height:1}
.rstats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rstat{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-family:'Jua';font-size:min(19px,3.4vh)}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.report{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
.rgroup{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px}
.rgroup h3{font-family:'Jua';font-size:min(18px,3.2vh);margin:0 0 4px}
.wlist{display:flex;flex-wrap:wrap;gap:5px}
.wchip{font-size:min(14px,2.5vh);background:#eef3ff;border:2px solid #c9d6f5;border-radius:999px;padding:2px 9px}
.wchip b{font-family:'Jua'}
.wchip.bad{background:#ffe9ec;border-color:#ffc2cb}
.ver{position:absolute;right:10px;bottom:8px;font-size:12px;color:#fff;opacity:.5;z-index:6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>

<div id="pad" hidden><button class="fire" id="fireB" aria-label="미사일 발사">🚀<br>발사</button></div>
<div class="keyhelp" id="keyhelp" hidden>↑ ↓ ← → 비행 · 스페이스 발사 · R 다시 듣기 · M 지도로</div>
<div id="rotate" hidden><div class="ph">📱</div><div>가로로 돌려 주세요!</div><div style="font-family:'Gowun Dodum';font-size:16px;opacity:.8">넓은 하늘에서 날아야 잘 보여요</div></div>

<div class="scr" id="title">
  <div class="tcard">
    <div class="tplane"><span class="jet">💨</span><img id="tFace" alt="진표"><span class="w1"></span><span class="w2"></span></div>
    <h1 class="logo">진표의<br>영어 비행단</h1>
    <button class="big" id="startB">출격!</button>
    <p class="sub">하늘을 날며 장애물을 피하고,<br>정답을 미사일로 맞히거나 정답 문으로 통과해요<br><b>초1 ~ 초6</b> · 낱말 514 · 문장 162 · 대화 46</p>
  </div>
  <div class="ver" id="ver"></div>
</div>

<div class="scr" id="map" hidden>
  <h2>몇 학년 하늘로 갈까?</h2>
  <div class="stages" id="stages"></div>
  <div class="maprow">
    <div class="pill" id="totalStars">★ 0</div>
    <button class="pill" id="reviewB">📘 틀린 낱말 복습</button>
    <button class="pill" id="backT">처음으로</button>
  </div>
  <div class="maprow">
    <button class="pill" id="voiceB">🔊 영어 소리 시험</button>
    <button class="pill" id="voiceNext">🔁 다른 목소리로</button>
  </div>
  <p class="sub" id="voiceInfo"></p>
  <p class="sub" id="memInfo"></p>
</div>

<div class="scr" id="over" hidden>
  <div class="rcard">
    <div class="medal">🛟</div>
    <h2>다시 한 번!</h2>
    <p class="sub" id="oMsg"></p>
    <div class="rbtns"><button class="big" id="oRetry">다시 출격</button><button class="big" id="oMap" style="background:#fff">지도로</button></div>
  </div>
</div>

<div class="scr" id="result" hidden>
  <div class="rcard">
    <div class="medal" id="rMedal">🏅</div>
    <h2 id="rTitle">통과!</h2>
    <div class="rstats"><div class="rstat" id="rStars"></div><div class="rstat" id="rRight"></div><div class="rstat" id="rNew"></div></div>
    <div class="report" id="rReport"></div>
    <div class="rbtns"><button class="big" id="rNext">다음 하늘 →</button><button class="big" id="rMap" style="background:#fff">지도로</button></div>
  </div>
</div>
</div>

<script>

/* ================= 배움 기록 : 간격 반복(Leitner) =================
   낱말마다 숙련도 lv 0~5 를 기억해서, 틀린 낱말은 곧 다시,
   잘 아는 낱말은 한참 뒤에 다시 나오게 해요. */
const MEM_KEY = 'jinpyo-sky-mem-v1';
let mem = {}, clock = 0;
try { const o = JSON.parse(localStorage.getItem(MEM_KEY) || 'null'); if (o) { mem = o.mem || {}; clock = o.clock || 0; } } catch (e) {}
let memDirty = false;
function memSave() { memDirty = true; }
setInterval(() => {
  if (!memDirty) return; memDirty = false;
  try { localStorage.setItem(MEM_KEY, JSON.stringify({ mem, clock })); } catch (e) {}
}, 1500);
const STEPS = [2, 5, 12, 28, 60, 150];
function memOf(w) { return mem[w] || (mem[w] = { lv: 0, due: 0, n: 0, miss: 0 }); }
function markRight(w) { const m = memOf(w); m.lv = Math.min(5, m.lv + 1); m.due = clock + STEPS[m.lv]; m.n++; memSave(); }
function markWrong(w) { const m = memOf(w); m.lv = 0; m.due = clock + 2; m.n++; m.miss++; memSave(); }
function knownLv(w) { return mem[w] ? mem[w].lv : -1; }

/* ================= 문제 만들기 ================= */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const pick = a => a[ri(0, a.length - 1)];
function pickMany(arr, n, bad) {
  const out = [], seen = new Set(); let guard = 0;
  while (out.length < n && guard++ < 400) { const x = pick(arr); const k = x.w || x.en || x.a || x; if (seen.has(k) || (bad && bad(x))) continue; seen.add(k); out.push(x); }
  return out;
}
const hasJong = t => { const c = t.charCodeAt(t.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 > 0; };
const jo = (t, pair) => t + (hasJong(t) ? pair[0] : pair[1]);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function blankOut(en, b) { return en.replace(new RegExp('(^|[\\s])' + esc(b) + '($|[\\s.,!?])'), (m, a, z) => a + '___' + z); }

function wordPool(g) { let p = WORDS.filter(x => x.g === g); if (p.length < 16) p = WORDS.filter(x => x.g <= g); return p; }
function sentPool(g) { let p = SENTS.filter(x => x.g === g); if (p.length < 6) p = SENTS.filter(x => x.g <= g); return p; }
function talkPool(g) { let p = TALKS.filter(x => x.g === g); if (p.length < 4) p = TALKS.filter(x => x.g <= g); return p; }

// 복습할 때가 된 낱말 → 아직 안 배운 낱말 → 아무 낱말 순으로
function pickWord(g, reviewOnly) {
  const pool = wordPool(g);
  const due = pool.filter(x => mem[x.w] && mem[x.w].due <= clock && mem[x.w].lv < 5);
  if (reviewOnly) { const miss = pool.filter(x => mem[x.w] && mem[x.w].miss > 0); if (miss.length) return pick(miss); }
  const fresh = pool.filter(x => !mem[x.w]);
  const r = Math.random();
  if (due.length && r < 0.45) return pick(due);
  if (fresh.length && r < 0.8) return pick(fresh);
  if (due.length) return pick(due);
  return pick(pool);
}
function distract(pool, right, n) {
  const bad = o => o.w === right.w || o.k === right.k || (right.e && o.e && o.e === right.e);
  return pickMany(pool.filter(o => !bad(o)), n);
}

/* --- 낱말 문제 --- */
function wordQ(g, review) {
  const pool = wordPool(g), right = pickWord(g, review), others = distract(pool, right, 2);
  if (others.length < 2) return sentQ(g);
  const lv = knownLv(right.w);
  const base = { key: right.w, word: right, hintEn: right.w, hintKo: right.k, emoji: right.e, read: right.w };
  const kinds = [];
  if (right.e) kinds.push('pic2w', 'pic2w');
  kinds.push('ko2w', 'w2ko', 'listen');
  // 두 번 이상 맞힌 낱말은 철자 조립으로 확실히 익혀요
  if (lv >= 1 && right.w.length >= 3 && right.w.length <= 8 && !/[ .']/.test(right.w)) kinds.push('spell', 'spell');
  if (lv >= 2) kinds.push('usage');
  const kind = pick(kinds);
  if (kind === 'spell') {
    const letters = right.w.split('');
    return Object.assign(base, {
      play: 'order', ask: '글자를 순서대로 맞혀 낱말을 만들어요!',
      show: (right.e ? right.e + ' ' : '') + right.k, showType: 'big',
      seq: letters, extra: shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c => letters.indexOf(c) < 0)).slice(0, 2),
      ans: right.w, en: '', 
    });
  }
  if (kind === 'usage') {
    const s = SENTS.filter(x => new RegExp('(^|\\s)' + esc(right.w) + '($|[\\s.,!?])').test(x.en));
    if (s.length) {
      const sen = pick(s);
      return Object.assign(base, {
        play: 'shoot', ask: '빈칸에 알맞은 낱말을 골라요!',
        show: blankOut(sen.en, right.w), show2: sen.ko, showType: 'sen',
        choices: shuffle([right, ...others]).map(o => ({ t: o.w, ok: o.w === right.w, ko: o.k })),
        ans: right.w, en: '', read: sen.en, hintEn: sen.en, hintKo: sen.ko,
      });
    }
  }
  if (kind === 'pic2w') return Object.assign(base, {
    play: 'shoot', ask: '이 그림을 영어로 뭐라고 할까?', show: right.e, showType: 'emoji',
    choices: shuffle([right, ...others]).map(o => ({ t: o.w, ok: o.w === right.w, ko: o.k })), ans: right.w, en: '',
  });
  if (kind === 'ko2w') return Object.assign(base, {
    play: 'shoot', ask: jo(right.k, ['은', '는']) + ' 영어로 뭘까?', show: (right.e ? right.e + ' ' : '') + right.k, showType: 'big',
    choices: shuffle([right, ...others]).map(o => ({ t: o.w, ok: o.w === right.w, ko: o.k })), ans: right.w, en: '',
  });
  if (kind === 'w2ko') return Object.assign(base, {
    play: 'shoot', ask: '이 영어 낱말의 뜻은?', show: right.w, showType: 'word',
    choices: shuffle([right, ...others]).map(o => ({ t: o.k, ok: o.w === right.w, en: o.w })), ans: right.k, en: right.w,
  });
  return Object.assign(base, { // listen
    play: 'gate', ask: '잘 듣고 알맞은 문으로 지나가요!', show: '🔊', showType: 'emoji',
    choices: shuffle([right, ...others]).map(o => ({ t: o.k, ok: o.w === right.w, en: o.w })), ans: right.k, en: right.w,
  });
}

/* --- 문장 문제 --- */
function sentQ(g) {
  const pool = sentPool(g); if (!pool.length) return wordQ(g);
  const right = pick(pool);
  const words = right.en.replace(/[.!?]$/, '').split(' ');
  const kinds = ['blank', 'blank', 'listen2ko'];
  if (words.length >= 3 && words.length <= 5) kinds.push('order');
  const kind = pick(kinds);
  const base = { key: 'S:' + right.en, hintEn: right.en, hintKo: right.ko, read: right.en, sent: right };
  if (kind === 'order') return Object.assign(base, {
    play: 'order', ask: '낱말을 순서대로 맞혀 문장을 만들어요!', show: right.ko, showType: 'big',
    seq: words, extra: [], ans: right.en, en: '',
  });
  if (kind === 'listen2ko') {
    const others = pickMany(pool, 2, o => o.en === right.en || o.ko === right.ko);
    if (others.length === 2) return Object.assign(base, {
      play: 'gate', ask: '문장을 잘 듣고 알맞은 문으로!', show: '🔊', showType: 'emoji',
      choices: shuffle([right, ...others]).map(o => ({ t: o.ko, ok: o.en === right.en, en: o.en })),
      ans: right.ko, en: right.en,
    });
  }
  const opts = (POOL[right.p] || POOL.v).filter(x => x.toLowerCase() !== right.b.toLowerCase());
  const others = pickMany(opts, 2);
  if (others.length < 2) return wordQ(g);
  return Object.assign(base, {
    play: 'shoot', ask: '빈칸에 알맞은 말을 골라요!',
    show: blankOut(right.en, right.b), show2: right.ko, showType: 'sen',
    choices: shuffle([right.b, ...others]).map(o => ({ t: o, ok: o === right.b })),
    ans: right.b, en: '',
  });
}

/* --- 대화 문제 --- */
function talkQ(g) {
  const pool = talkPool(g); if (pool.length < 3) return sentQ(g);
  const right = pick(pool), others = pickMany(pool, 2, o => o.a === right.a);
  if (others.length < 2) return sentQ(g);
  return {
    key: 'T:' + right.q, play: 'shoot', ask: '알맞은 대답을 골라요!',
    show: right.q, show2: '— ?', showType: 'sen',
    choices: shuffle([right, ...others]).map(o => ({ t: o.a, ok: o.a === right.a, ko: (o.ko.split('—')[1] || o.ko).trim() })),
    ans: right.a, en: right.q, read: right.q + ' ... ' + right.a,
    hintEn: right.q + ' — ' + right.a, hintKo: right.ko,
  };
}

/* 학년이 올라갈수록 문장·대화 비중이 커져요 */
const SENT_RATE = [0.18, 0.3, 0.42, 0.5, 0.58, 0.62];
const TALK_RATE = [0.08, 0.1, 0.16, 0.18, 0.2, 0.22];
function makeQ(gi, review) {
  const g = gi + 1, r = Math.random();
  let q;
  if (!review && r < TALK_RATE[gi]) q = talkQ(g);
  else if (!review && r < TALK_RATE[gi] + SENT_RATE[gi]) q = sentQ(g);
  else q = wordQ(g, review);
  clock++;
  if (q.choices) q.choices = q.choices.map(c => ({ t: String(c.t), ok: !!c.ok, ko: c.ko || '', en: c.en || '' }));
  return q;
}

let AC = null, master = null, musicBus = null, soundOn = true, musicTimer = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = 0.22; musicBus.connect(master);
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, when, f2, bus) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), gn = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);

  if (e.key === 'ArrowDown' || e.key === 's') keys.d = 1;
  if (e.key === ' ') { firing = true; if (state === 'play') e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') speakQuestion();
  if (e.key === 'm' || e.key === 'M') { if (state === 'play') { try { speechSynthesis.cancel(); } catch (er) {} renderMap(); show('map'); state = 'map'; } }
  if (e.key === 'p' || e.key === 'P') { soundOn = !soundOn; if (!soundOn) { try { speechSynthesis.cancel(); } catch (er) {} } }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = 0;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.r = 0;
  if (e.key === 'ArrowUp' || e.key === 'w') keys.u = 0;

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
function toV(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale }; }
cv.addEventListener('pointerdown', e => {

  const near = b => (v.x - b.x) * (v.x - b.x) + (v.y - b.y) * (v.y - b.y) < (b.r + pad) * (b.r + pad);
  if (state === 'play') {

    if (near(BTN.home)) { SFX.tap(); try { speechSynthesis.cancel(); } catch (er) {} renderMap(); show('map'); state = 'map'; return; }
  }

const fireBtn = $('fireB');

  const k = pick(kinds);

    kind: k, x: VW + 60, y, y0: y, t: Math.random() * 100, hp: k === 'rock' ? 2 : 1,
    vx: -(spd * (k === 'bird' ? 1.35 : k === 'drone' ? 0.8 : 1.0)), amp: k === 'balloon' ? 40 : k === 'bird' ? 22 : 0,

function spawnItems() {

/* ================= 업데이트 ================= */
function update(dt) {
  frame += dt; modeT += dt; scroll += spd * dt;
  if (shake > 0) shake = Math.max(0, shake - 0.5 * dt);
  if (flash > 0) flash = Math.max(0, flash - dt);
  if (showAnsT > 0) showAnsT -= dt;
  if (banner) { banner.t += dt; if (banner.t > banner.life) banner = null; }

  // 비행기
  const ax = (keys.r - keys.l) * 0.85, ay = (keys.d - keys.u) * 0.85;
  P.vx = (P.vx + ax * dt) * Math.pow(0.87, dt); P.vy = (P.vy + ay * dt) * Math.pow(0.87, dt);
  if (!drag) { P.x += P.vx * dt; P.y += P.vy * dt; }
  P.x = Math.max(60, Math.min(VW * 0.76, P.x));
  P.y = Math.max(SKY_TOP + 26, Math.min(SKY_BOT - 14, P.y));
  P.tilt += (((drag ? 0 : P.vy) * 0.03) - P.tilt) * 0.2 * dt;
  P.prop += dt * 0.9;
  if (P.cool > 0) P.cool -= dt;
  if (P.inv > 0) P.inv -= dt;
  if (firing) shoot();

  // 구간 진행
  if (mode === 'fly') {
    if (modeT < FLY_LEN - 110 && modeT % (78 / S.foe) < dt) spawnFoe();
    if (modeT > 40 && modeT < FLY_LEN - 120 && modeT % 118 < dt) spawnItems();
    if (modeT > FLY_LEN) startQuiz();
  } else if (mode === 'clear') {
    // 정답을 다 읽어 줄 때까지 기다렸다가 다음 구간으로 (너무 오래 걸리면 그냥 넘어가요)
    const talking = soundOn && ('speechSynthesis' in window) && speechSynthesis.speaking;
    if ((modeT > 150 && !talking) || modeT > 660) afterQuiz();
  }

  // 미사일
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx * dt; b.t += dt;
    if (b.x > VW + 40) { bullets.splice(i, 1); continue; }
    let gone = false;
    for (const f of foes) {
      if (f.dead) continue;
      if (Math.abs(b.x - f.x) < f.r && Math.abs(b.y - f.y) < f.r) {
        f.hp--; gone = true; burst(b.x, b.y, '#fff3a8', 7, 2);
        if (f.hp <= 0) { f.dead = 1; explode(f.x, f.y, '#ffb43f'); stars++; floatText(f.x, f.y - 24, '★+1', '#ffd23f', 20); }
        else SFX.pop();
        break;
      }
    }
    if (!gone && mode === 'quiz' && Q && Q.play !== 'gate') {
      for (const t of targets) {
        if (t.dead) continue;
        const hw = Math.max(58, (t.pw || 60) / 2 + 10);
        const up = (t.ph || 40) / 2 + (t.kind === 'blimp' ? 48 : 10), dn = (t.ph || 40) / 2 + 10;
        if (Math.abs(b.x - t.x) < hw && b.y > t.y - up && b.y < t.y + dn) { gone = true; hitTarget(t); break; }
      }
    }
    if (!gone && boss && bossHP > 0 && Math.abs(b.x - boss.x) < 84 && Math.abs(b.y - boss.y) < 60) { gone = true; boss.hurt = 8; burst(b.x, b.y, '#ffd23f', 6, 2); tone(220, 0.07, 'square', 0.08); }
    if (gone) bullets.splice(i, 1);
  }

  // 장애물
  for (let i = foes.length - 1; i >= 0; i--) {
    const f = foes[i]; f.t += dt;
    f.x += f.vx * dt;
    f.rot += f.vr * dt;
    if (f.amp) f.y = f.y0 + Math.sin(f.t * 0.045) * f.amp;
    if (f.kind === 'drone' && state === 'play') {
      f.fireT -= dt;
      if (f.fireT <= 0 && f.x < VW - 40) { f.fireT = 140 + Math.random() * 120; efire.push({ x: f.x - 18, y: f.y, vx: -5.2 - sIndex * 0.25, vy: (P.y - f.y) * 0.004, t: 0 }); tone(330, 0.1, 'sawtooth', 0.08, 0, 180); }
    }
    if (f.dead || f.x < -70) { foes.splice(i, 1); continue; }
    if (P.inv <= 0 && Math.abs(f.x - P.x) < f.r + 4 && Math.abs(f.y - P.y) < f.r - 2) { explode(f.x, f.y, '#ff5d73'); foes.splice(i, 1); hurt(); }
  }
  // 적 총알
  for (let i = efire.length - 1; i >= 0; i--) {
    const b = efire[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.t += dt;
    if (b.x < -30) { efire.splice(i, 1); continue; }
    if (P.inv <= 0 && Math.abs(b.x - P.x) < 18 && Math.abs(b.y - P.y) < 14) { efire.splice(i, 1); burst(P.x, P.y, '#ff5d73', 12, 2.5); hurt(); }
  }
  // 별
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.x -= spd * dt; it.t += dt;
    if (it.x < -30) { items.splice(i, 1); continue; }
    if (Math.abs(it.x - P.x) < 30 && Math.abs(it.y - P.y) < 26) {
      items.splice(i, 1);
      if (it.kind === 'heart') { if (hearts < 5) hearts++; SFX.heal(); burst(it.x, it.y, '#ff5d73', 10, 2); floatText(it.x, it.y - 20, '❤️+1', '#ff5d73', 22); }
      else { stars++; SFX.star(); burst(it.x, it.y, '#ffd23f', 6, 1.6); }
    }
  }
  // 문제 타깃
  if (mode === 'quiz' || mode === 'clear') {
    for (const t of targets) {
      t.t += dt;
      if (t.dead === 2) { t.x += 5 * dt; t.y -= 1.2 * dt; continue; }
      if (t.dead) continue;
      if (t.x > t.hx) t.x = Math.max(t.hx, t.x - spd * 1.15 * dt);
      else t.x = t.hx + Math.sin(t.t * 0.02 + t.i) * 12;
      t.y = t.y0 + Math.sin(t.t * 0.03 + t.i) * 12;
      if (t.hit > 0) t.hit -= dt;
    }
    // 문 통과 판정
    if (Q && Q.play === 'gate' && mode === 'quiz') {
      for (const t of targets) {
        if (t.dead) continue;
        if (Math.abs(t.x - P.x) < 46 && Math.abs(t.y - P.y) < 62) { hitTarget(t); break; }
      }
    }
  }
  // 보스
  if (boss) {
    boss.t += dt; if (boss.hurt > 0) boss.hurt -= dt;
    const tx = VW - 150;
    boss.x += (tx - boss.x) * 0.01 * dt;
    boss.y = 300 + Math.sin(boss.t * 0.014) * 120;
    if (state === 'play' && bossHP > 0 && mode === 'quiz') {
      boss.fireT -= dt;
      if (boss.fireT <= 0) { boss.fireT = 100 + Math.random() * 60; for (const dy of [-26, 0, 26]) efire.push({ x: boss.x - 60, y: boss.y + dy, vx: -4.6, vy: dy * 0.02, t: 0 }); }
    }
  }
  // 배경
  for (const c of bg.mid) { c.x -= spd * 0.35 * dt; if (c.x < -140) { c.x = VW + Math.random() * 200; c.y = 120 + Math.random() * 300; } }
  for (const c of bg.near) { c.x -= spd * 0.85 * dt; if (c.x < -140) { c.x = VW + Math.random() * 200; c.y = 430 + Math.random() * 90; } }
}
function hitTarget(t) {
  if (t.dead || mode !== 'quiz') return;
  if (Q.play === 'order') {
    if (t.text === Q.seq[seqIdx]) {
      t.dead = 1; seqIdx++; SFX.gate(); burst(t.x, t.y, '#3fb96b', 14, 2.4); floatText(t.x, t.y - 30, t.text, '#3fb96b', 24);
      if (seqIdx >= Q.seq.length) answerRight();
    } else {
      t.hit = 20; answerWrong(t.text);
      if (hearts > 0) { seqIdx = 0; for (const o of targets) if (o.dead === 1) { o.dead = 0; o.x = VW + 120 + o.i * 150; } }
    }
    return;
  }
  if (t.ok) { t.dead = 1; explode(t.x, t.y, '#3fb96b'); answerRight(); }
  else { t.hit = 20; answerWrong(Q.choices ? Q.choices.find(c => c.t === t.text) : null); }
}
function hurt() {
  if (P.inv > 0) return;
  hearts--; P.inv = 100; SFX.hurt(); shake = 12; flash = 16;
  if (hearts <= 0) gameOver();

/* ================= 배경 그리기 ================= */
function drawSky() {
  const gd = g.createLinearGradient(0, 0, 0, VH);
  gd.addColorStop(0, S.sky[0]); gd.addColorStop(1, S.sky[1]);
  g.fillStyle = gd; g.fillRect(0, 0, VW, VH);
  if (S.land === 'space' || S.land === 'city') {
    for (const s of bg.stars) { g.globalAlpha = 0.45 + Math.sin(frame * 0.04 + s.ph) * 0.45; circle((s.x - scroll * 0.06) % VW + (s.x < 0 ? VW : 0), s.y, s.r, '#fff'); }
    g.globalAlpha = 1;
  }
  // 해·달
  const sx = 790, sy = 120;
  g.globalAlpha = .5; circle(sx, sy, 62, S.sun); g.globalAlpha = 1; circle(sx, sy, 40, S.sun);
  // 먼 산
  const off = (scroll * 0.12) % 400;
  g.fillStyle = S.land === 'sea' ? 'rgba(255,255,255,.25)' : 'rgba(0,0,0,.13)';
  g.beginPath(); g.moveTo(-100, VH);
  for (let i = -1; i < 9; i++) {
    const m = bg.far[(i + 8) % bg.far.length], x = i * 200 - off + 60;
    g.lineTo(x, 470 - m.h); g.lineTo(x + m.w * 0.5, 470);
  }
  g.lineTo(VW + 100, VH); g.closePath(); g.fill();
  // 중간 구름
  for (const c of bg.mid) drawCloud(c.x, c.y, c.s, 'rgba(255,255,255,.55)');
  // 바닥
  drawLand();
  // 앞 구름
  for (const c of bg.near) drawCloud(c.x, c.y, c.s * 1.25, 'rgba(255,255,255,.85)');
  // 속도선
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const y = 130 + ((i * 61 + scroll * 1.4) % (VH - 150));
    const x = VW - ((i * 173 + scroll * 5.5) % (VW + 300));
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 48, y); g.stroke();
  }
}
function drawCloud(x, y, s, col) {

  g.beginPath(); g.arc(0, 0, 26, 0, TAU); g.arc(28, 7, 20, 0, TAU); g.arc(-28, 9, 18, 0, TAU); g.arc(6, -15, 19, 0, TAU); g.fill();

function drawLand() {
  const y0 = 486, off = scroll % 120;
  if (S.land === 'sea') {
    g.fillStyle = '#2b7fd0'; g.fillRect(0, y0, VW, VH - y0);
    g.fillStyle = 'rgba(255,255,255,.4)';

  } else if (S.land === 'dune') {

    g.lineTo(VW, VH); g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,.08)';

  } else {

    g.lineTo(VW, VH); g.closePath(); g.fill();

    for (let i = -1; i < 7; i++) { const x = i * 200 - (scroll * 1) % 200; g.fillStyle = '#2f8c4a'; fillRR(x + 90, y0 + 2, 9, 30, 3, '#7a5433'); circle(x + 94, y0 - 4, 20, '#2f8c4a'); }
  }

/* ================= 캐릭터 그리기 ================= */
function drawPlane() {
  if (P.inv > 0 && Math.floor(frame / 4) % 2) return;
  g.save(); g.translate(P.x, P.y); g.rotate(P.tilt);
  // 배기 불꽃
  const fl = 16 + Math.sin(frame * 0.8) * 6;
  g.beginPath(); g.moveTo(-34, -7); g.lineTo(-34 - fl, 0); g.lineTo(-34, 7); g.closePath(); g.fillStyle = '#ffb43f'; g.fill();
  g.beginPath(); g.moveTo(-34, -4); g.lineTo(-34 - fl * .6, 0); g.lineTo(-34, 4); g.closePath(); g.fillStyle = '#fff3a8'; g.fill();
  // 꼬리 날개
  g.beginPath(); g.moveTo(-26, -4); g.lineTo(-38, -30); g.lineTo(-18, -8); g.closePath(); g.fillStyle = '#2f9cf0'; g.fill(); stroke(3.4);

function fitTarget(t) {
  const maxW = t.kind === 'gate' ? 84 : 210, ko = /[가-힯]/.test(t.text);
  for (let n = 1; n <= 3; n++) {
    const parts = splitLines(t.text, n);
    for (let fs = ko ? 24 : 30; fs >= 11; fs--) {
      setFont(fs);
      let w = 0; for (const p of parts) w = Math.max(w, g.measureText(p).width);
      if (w + 18 <= maxW) {
        t.lines = parts; t.fs = fs; t.pw = Math.max(54, w + 20);
        t.ph = Math.max(38, parts.length * fs * 1.25 + 14);
        t.w = t.pw; t.h = t.ph;
        return parts;
      }
    }
  }
  t.lines = [t.text]; t.fs = 11; t.pw = maxW; t.ph = 38; t.w = maxW; t.h = 38;
  return t.lines;
}
function splitLines(txt, n) {
  if (n === 1) return [txt];
  const words = txt.split(' ');
  if (words.length < n) {
    const arr = [...txt], per = Math.ceil(arr.length / n), out = [];
    for (let i = 0; i < n; i++) { const t = arr.slice(i * per, (i + 1) * per).join(''); if (t) out.push(t); }
    return out;
  }
  const per = Math.ceil(txt.length / n), out = []; let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > per && out.length < n - 1) { out.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  out.push(cur); return out;
}

  try { localStorage.setItem(VOICE_KEY, enVoice ? enVoice.name : ''); } catch (e) {}
  const was = soundOn; soundOn = true;
  speak(['이 목소리는 어때요?', 'ko'], ['Hello! Can you hear me?', 'en']);
  soundOn = was;
  voiceLabel('');
  setTimeout(() => voiceLabel(''), 2600);
});
$('startB').addEventListener('click', () => { audioInit(); SFX.tap(); renderMap(); show('map'); state = 'map'; say('몇 학년 하늘로 갈까?'); });
$('backT').addEventListener('click', () => { SFX.tap(); show('title'); state = 'title'; });
$('reviewB').addEventListener('click', () => {
  const weak = Object.entries(mem).filter(([w, m]) => m.miss > 0);
  if (!weak.length) { say('아직 틀린 낱말이 없어요! 먼저 비행을 해 볼까요?'); $('memInfo').textContent = '아직 틀린 낱말이 없어요. 먼저 한 판 날아 볼까요? ✈️'; return; }
  const gs = weak.map(([w]) => { const x = WORDS.find(y => y.w === w); return x ? x.g : 1; });
  const g0 = Math.round(gs.reduce((a, b) => a + b, 0) / gs.length) - 1;
  SFX.tap(); startStage(Math.max(0, Math.min(5, g0)), true);
});
$('oRetry').addEventListener('click', () => { SFX.tap(); hearts = 5; efire = []; foes = []; resetPlayer(); P.inv = 100; show(null); state = 'play'; if (mode === 'quiz') { tries = 0; seqIdx = 0; for (const t of targets) { t.dead = 0; t.x = VW + 120 + t.i * (t.kind === 'block' ? 150 : 40); } } else { mode = 'fly'; modeT = 0; } });
$('oMap').addEventListener('click', () => { SFX.tap(); renderMap(); show('map'); state = 'map'; });
$('rNext').addEventListener('click', () => { SFX.tap(); startStage(sIndex < STAGES.length - 1 ? sIndex + 1 : 0, false); });
$('rMap').addEventListener('click', () => { SFX.tap(); renderMap(); show('map'); state = 'map'; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { keys.l = keys.r = keys.u = keys.d = 0; firing = false; if (AC) AC.suspend(); } else if (AC) AC.resume(); });

/* ================= 크기 ================= */
function resize() {
  const r = cv.getBoundingClientRect();
  if (r.width === cssW && r.height === cssH) return;
  cssW = r.width; cssH = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / VW, cssH / VH);
  ox = (cssW - VW * scale) / 2; oy = (cssH - VH * scale) / 2;
  $('rotate').hidden = !(isTouch && cssH > cssW * 1.15);
}

/* ================= 태블릿에서 편하게 ================= */
// 인터넷이 없어도 놀 수 있게 저장해 둬요
if ('serviceWorker' in navigator) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// 놀 때는 화면이 꺼지지 않게
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && (state === 'play' || state === 'map')) keepAwake(); });

/* ================= 루프 ================= */
resetPlayer(); bullets = []; foes = []; efire = []; items = []; parts = []; targets = []; makeBG();
let last = performance.now();
function loop(now) {
  const dt = Math.min(2.5, (now - last) / 16.67); last = now;
  resize();
  if (state === 'play') update(dt);
  else if (state === 'title' || state === 'map') { scroll += 1.6 * dt; frame += dt; for (const c of bg.mid) { c.x -= 0.6 * dt; if (c.x < -140) c.x = VW + Math.random() * 200; } for (const c of bg.near) { c.x -= 1.3 * dt; if (c.x < -140) c.x = VW + Math.random() * 200; } }
  else { frame += dt; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
